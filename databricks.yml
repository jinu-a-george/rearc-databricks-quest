bundle:
  name: rearc-catalog-bootstrap
  databricks_cli_version: ">= 1.23.0"

workspace:
  host: https://dbc-449e034e-7150.cloud.databricks.com

variables:
  sql_warehouse_id:
    description: SQL warehouse used by the environment setup task.
    default: 83d1a2fa9d4b8405
  raw_volume_path:
    description: Unity Catalog Volume path containing the original source files.
    default: /Volumes/rearc_catalog/data_quest_bronze/raw_data
  bls_contact_email:
    description: Contact email supplied to the BLS source server.
  monitor_cron_expression:
    description: Quartz schedule for source monitoring; default is every Monday at 06:00 UTC.
    default: "0 0 6 ? * MON"

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-449e034e-7150.cloud.databricks.com

resources:
  jobs:
    setup_environment:
      name: rearc-data-quest-environment-setup
      description: Creates the Unity Catalog catalog, schemas, and raw volume.
      tasks:
        - task_key: create_catalog_schemas_and_volume
          sql_task:
            file:
              path: ${workspace.file_path}/sql/setup_environment.sql
              source: WORKSPACE
            warehouse_id: ${var.sql_warehouse_id}
    bronze_ingestion_and_load:
      name: rearc-data-quest-data-pipeline
      description: Monitors and snapshots sources, then refreshes Bronze, Silver, and Gold.
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: ${var.monitor_cron_expression}
        timezone_id: UTC
        pause_status: UNPAUSED
      environments:
        - environment_key: ingestion
          spec:
            environment_version: "6"
            dependencies:
              - "requests>=2.32,<3"
      tasks:
        - task_key: download_source_files
          spark_python_task:
            python_file: ${workspace.file_path}/src/ingestion/main.py
            source: WORKSPACE
            parameters:
              - --bls-contact-email
              - ${var.bls_contact_email}
              - --raw-volume-path
              - ${var.raw_volume_path}
              - --job-id
              - "{{job.id}}"
              - --job-run-id
              - "{{job.run_id}}"
              - --project-root
              - ${workspace.file_path}
          environment_key: ingestion
        - task_key: should_process_snapshot
          depends_on:
            - task_key: download_source_files
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.download_source_files.values.process_required}}"
            right: "true"
        - task_key: load_bronze_tables
          depends_on:
            - task_key: should_process_snapshot
              outcome: "true"
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze.id}
        - task_key: load_silver_tables
          depends_on:
            - task_key: load_bronze_tables
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver.id}
        - task_key: load_gold_tables
          depends_on:
            - task_key: load_silver_tables
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold.id}
        - task_key: finalize_snapshot
          depends_on:
            - task_key: load_gold_tables
          spark_python_task:
            python_file: ${workspace.file_path}/src/ingestion/finalize.py
            source: WORKSPACE
            parameters:
              - --snapshot-id
              - "{{tasks.download_source_files.values.snapshot_id}}"
              - --ingestion-attempt-id
              - "{{tasks.download_source_files.values.ingestion_attempt_id}}"
              - --raw-volume-path
              - ${var.raw_volume_path}
              - --project-root
              - ${workspace.file_path}
          environment_key: ingestion
  pipelines:
    bronze:
      name: rearc-data-quest-bronze
      catalog: rearc_catalog
      schema: data_quest_bronze
      serverless: true
      configuration:
        raw_volume_path: ${var.raw_volume_path}
      libraries:
        - file:
            path: ${workspace.file_path}/src/pipeline/bronze.py
    silver:
      name: rearc-data-quest-silver
      catalog: rearc_catalog
      schema: data_quest_silver
      serverless: true
      configuration:
        raw_volume_path: ${var.raw_volume_path}
      libraries:
        - file:
            path: ${workspace.file_path}/src/pipeline/silver.py
    gold:
      name: rearc-data-quest-gold
      catalog: rearc_catalog
      schema: data_quest_gold
      serverless: true
      configuration:
        project_root: ${workspace.file_path}
        raw_volume_path: ${var.raw_volume_path}
      libraries:
        - file:
            path: ${workspace.file_path}/src/pipeline/gold.py
        - file:
            path: ${workspace.file_path}/src/pipeline/analytics.py
